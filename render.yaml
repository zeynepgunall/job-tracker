services:
  # Backend API
  - type: web
    name: job-tracker-backend
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 3000
    healthCheckPath: /api/health

  # Frontend Static Site
  - type: web
    name: job-tracker-frontend
    env: static
    buildCommand: ""
    # Publish Directory boş bırakılmalı - Render otomatik index.html'i bulur

