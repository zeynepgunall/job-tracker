<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Job Tracker - Login</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    .login-container {
      max-width: 400px;
      margin: 100px auto;
      padding: 2rem;
    }
    .login-card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 2rem;
      box-shadow: var(--shadow);
    }
    .login-header {
      text-align: center;
      margin-bottom: 2rem;
    }
    .login-header h1 {
      margin: 0 0 0.5rem 0;
      font-size: 1.8rem;
    }
    .login-header p {
      color: var(--text-muted);
      margin: 0;
    }
    .tabs {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
      border-bottom: 2px solid var(--border);
    }
    .tab {
      flex: 1;
      padding: 0.75rem;
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      cursor: pointer;
      color: var(--text-muted);
      font-weight: 500;
      transition: all 0.2s;
    }
    .tab.active {
      color: var(--primary);
      border-bottom-color: var(--primary);
    }
    .tab:hover {
      color: var(--text);
    }
    .form-section {
      display: none;
    }
    .form-section.active {
      display: block;
    }
    .error-message {
      background: var(--danger-bg);
      color: var(--danger);
      padding: 0.75rem;
      border-radius: 6px;
      margin-bottom: 1rem;
      display: none;
    }
    .error-message.show {
      display: block;
    }
    .success-message {
      background: var(--success-bg);
      color: var(--success);
      padding: 0.75rem;
      border-radius: 6px;
      margin-bottom: 1rem;
      display: none;
    }
    .success-message.show {
      display: block;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="login-container">
      <div class="login-card">
        <div class="login-header">
          <h1>Job Tracker</h1>
          <p>Başvurularını düzenli takip et</p>
        </div>

        <div class="tabs">
          <button class="tab active" data-tab="login">Giriş Yap</button>
          <button class="tab" data-tab="register">Kayıt Ol</button>
        </div>

        <div id="errorMessage" class="error-message"></div>
        <div id="successMessage" class="success-message"></div>

        <!-- Login Form -->
        <form id="loginForm" class="form-section active">
          <label>
            <span>Kullanıcı Adı veya E-posta</span>
            <input id="loginUsername" type="text" required placeholder="kullaniciadi veya email@example.com" />
          </label>

          <label>
            <span>Şifre</span>
            <input id="loginPassword" type="password" required placeholder="••••••••" />
          </label>

          <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">
            Giriş Yap
          </button>
        </form>

        <!-- Register Form -->
        <form id="registerForm" class="form-section">
          <label>
            <span>Kullanıcı Adı *</span>
            <input id="registerUsername" type="text" required placeholder="kullaniciadi" minlength="3" />
          </label>

          <label>
            <span>E-posta *</span>
            <input id="registerEmail" type="email" required placeholder="email@example.com" />
          </label>

          <label>
            <span>Şifre *</span>
            <input id="registerPassword" type="password" required placeholder="En az 6 karakter" minlength="6" />
          </label>

          <label>
            <span>Şifre Tekrar *</span>
            <input id="registerPasswordConfirm" type="password" required placeholder="Şifreyi tekrar girin" />
          </label>

          <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">
            Kayıt Ol
          </button>
        </form>
      </div>
    </div>
  </div>

  <script src="config.js"></script>
  <script>
    // Config dosyasından ayarları al
    // API Base URL - config.js'den import edilir, fallback olarak dynamic ayarla
    let API_BASE_URL;
    if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
      API_BASE_URL = "http://localhost:3000/api";
    } else {
      // Production'da backend'den serve edildiği için relative path kullan
      API_BASE_URL = "/api";
    }
    const TOKEN_KEY = (window.CONFIG && window.CONFIG.TOKEN_KEY) || "job_tracker_token";

    // Check if already logged in
    const token = localStorage.getItem(TOKEN_KEY);
    if (token) {
      // Verify token
      fetch(`${API_BASE_URL}/auth/me`, {
        headers: {
          'Authorization': `Bearer ${token}`
        }
      })
      .then(res => {
        if (res.ok) {
          window.location.href = 'index.html';
        } else {
          localStorage.removeItem(TOKEN_KEY);
        }
      })
      .catch(() => {
        localStorage.removeItem(TOKEN_KEY);
      });
    }

    // Tab switching
    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => {
        const targetTab = tab.dataset.tab;
        
        // Update tabs
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        
        // Update forms
        document.querySelectorAll('.form-section').forEach(s => s.classList.remove('active'));
        document.getElementById(`${targetTab}Form`).classList.add('active');
        
        // Clear messages
        hideMessages();
      });
    });

    function showError(message) {
      const errorEl = document.getElementById('errorMessage');
      errorEl.textContent = message;
      errorEl.classList.add('show');
      document.getElementById('successMessage').classList.remove('show');
    }

    function showSuccess(message) {
      const successEl = document.getElementById('successMessage');
      successEl.textContent = message;
      successEl.classList.add('show');
      document.getElementById('errorMessage').classList.remove('show');
    }

    function hideMessages() {
      document.getElementById('errorMessage').classList.remove('show');
      document.getElementById('successMessage').classList.remove('show');
    }

    // Login form
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      hideMessages();

      const username = document.getElementById('loginUsername').value.trim();
      const password = document.getElementById('loginPassword').value;

      try {
        const response = await fetch(`${API_BASE_URL}/auth/login`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ username, password }),
        });

        let data;
        try {
          data = await response.json();
        } catch (jsonError) {
          // If response is not JSON, it's likely a connection error
          if (!response.ok) {
            showError(`Backend hatası (${response.status}): ${response.statusText}. Backend çalışıyor mu kontrol edin.`);
          } else {
            showError('Geçersiz yanıt alındı. Backend çalışıyor mu kontrol edin.');
          }
          console.error('Response error:', jsonError);
          return;
        }

        if (!response.ok) {
          showError(data.error || data.message || 'Giriş başarısız');
          return;
        }

        // Save token
        localStorage.setItem(TOKEN_KEY, data.token);
        showSuccess('Giriş başarılı! Yönlendiriliyorsunuz...');
        
        setTimeout(() => {
          window.location.href = 'index.html';
        }, 1000);
      } catch (error) {
        console.error('Login error:', error);
        showError(`Bağlantı hatası: ${error.message}. Backend'in çalıştığından emin olun.`);
      }
    });

    // Register form
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      hideMessages();

      const username = document.getElementById('registerUsername').value.trim();
      const email = document.getElementById('registerEmail').value.trim();
      const password = document.getElementById('registerPassword').value;
      const passwordConfirm = document.getElementById('registerPasswordConfirm').value;

      // Validation
      if (username.length < 3) {
        showError('Kullanıcı adı en az 3 karakter olmalıdır');
        return;
      }

      if (password.length < 6) {
        showError('Şifre en az 6 karakter olmalıdır');
        return;
      }

      if (password !== passwordConfirm) {
        showError('Şifreler eşleşmiyor');
        return;
      }

      try {
        const response = await fetch(`${API_BASE_URL}/auth/register`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ username, email, password }),
        });

        let data;
        try {
          data = await response.json();
        } catch (jsonError) {
          // If response is not JSON, it's likely a connection error
          if (!response.ok) {
            showError(`Backend hatası (${response.status}): ${response.statusText}. Backend çalışıyor mu kontrol edin.`);
          } else {
            showError('Geçersiz yanıt alındı. Backend çalışıyor mu kontrol edin.');
          }
          console.error('Response error:', jsonError);
          return;
        }

        if (!response.ok) {
          showError(data.error || data.message || 'Kayıt başarısız');
          return;
        }

        // Save token
        localStorage.setItem(TOKEN_KEY, data.token);
        showSuccess('Kayıt başarılı! Yönlendiriliyorsunuz...');
        
        setTimeout(() => {
          window.location.href = 'index.html';
        }, 1000);
      } catch (error) {
        console.error('Register error:', error);
        showError(`Bağlantı hatası: ${error.message}. Backend'in çalıştığından emin olun.`);
      }
    });
  </script>
</body>
</html>
